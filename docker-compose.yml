version: '3'

services:
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always

  backend:
    env_file:
      - .env
    build: ./backend
    container_name: backend
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - db
    restart: always

  db:
    image: postgres:14
    container_name: postgres-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always
    

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
volumes:
  postgres-data: